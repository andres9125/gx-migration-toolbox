name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: gx-migration-toolbox scan --source examples --output "$RUNNER_TEMP/inventory.json" --runtime-pattern legacy.runtime.
