[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-migration-toolbox"
version = "0.1.0"
description = "Read-only source inventory and dependency signals for modernization planning."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["static-analysis", "source-inventory", "modernization", "migration", "dependency-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
gx-migration-toolbox = "gx_migration_toolbox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
